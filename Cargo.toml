[package]
name = "lazyssh"
version = "0.1.0"
edition = "2021"
description = "A simple terminal UI for managing and connecting to SSH servers"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
